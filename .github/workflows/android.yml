name: Android CI
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle testDebugUnitTest
      - run: gradle assembleDebug
      - name: Prepare release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk Tirupati-Darshan-Assistant-v0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tirupati-darshan-assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Tirupati Darshan Assistant v0.1.0
          files: Tirupati-Darshan-Assistant-v0.1.0.apk
          generate_release_notes: true
